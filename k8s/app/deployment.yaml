apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-app, labels: {app: demo-app}}
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-app}}
  template:
    metadata: {labels: {app: demo-app}}
    spec:
      containers:
      - name: app
        image: demo-app:v1
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8000}]
        resources:
          requests: {cpu: 200m, memory: 128Mi}
          limits:   {cpu: 200m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 2
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: {name: demo-app, labels: {app: demo-app}}
spec:
  selector: {app: demo-app}
  ports: [{name: http, port: 80, targetPort: 8000}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: demo-app, labels: {release: monitoring}}
spec:
  selector: {matchLabels: {app: demo-app}}
  endpoints: [{port: http, path: /metrics, interval: 5s}]
