apiVersion: batch/v1
kind: Job
metadata: {name: k6-replay}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:latest
        imagePullPolicy: IfNotPresent
        imagePullPolicy: IfNotPresent
        args: ["run", "/scripts/replay.js"]
        volumeMounts: [{name: scripts, mountPath: /scripts}]
      volumes:
      - name: scripts
        configMap: {name: k6-script}
